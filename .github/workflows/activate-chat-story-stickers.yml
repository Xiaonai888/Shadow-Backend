name: Activate Chat Story Stickers Backend

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/activate-chat-story-stickers.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chat-story-stickers-backend
  cancel-in-progress: false

jobs:
  activate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply and verify backend integration
        run: node scripts/activateChatStoryStickerStage4.mjs
      - name: Commit backend replacements
        run: |
          git add server.js src/controllers/chatStoryEpisodes.controller.js
          if git diff --cached --quiet; then
            echo "Backend Sticker integration already active"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Activate Chat Story Sticker backend integration"
            git push origin HEAD:main
          fi
