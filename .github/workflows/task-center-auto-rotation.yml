name: Task Center Auto Rotation

on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:

concurrency:
  group: task-center-auto-rotation
  cancel-in-progress: false

jobs:
  rotate-task-center:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Rotate Task Center stories
        run: |
          curl --fail-with-body --retry 3 --retry-all-errors --max-time 120 \
            -X POST \
            -H "Content-Type: application/json" \
            -H "x-task-center-auto-secret: ${{ secrets.TASK_CENTER_AUTO_SECRET }}" \
            "https://shadow-backend-kucw.onrender.com/api/task-center/auto-rotate/run"
