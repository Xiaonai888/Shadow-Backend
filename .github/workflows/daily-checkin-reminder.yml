name: Daily Check-in Reminder

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: daily-checkin-reminder
  cancel-in-progress: false

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send daily reminder
        run: |
          curl --fail-with-body --retry 3 --retry-all-errors --max-time 120 \
            -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "https://shadow-backend-kucw.onrender.com/api/mails/daily-checkin-reminder/run"
