
name: Backend route rate-limit check

on:
  pull_request:
    paths:
      - 'src/routes/**'
      - 'server.js'
      - 'scripts/checkRouteRateLimits.mjs'
      - '.github/workflows/route-rate-limit-check.yml'
  push:
    branches:
      - main
    paths:
      - 'src/routes/**'
      - 'server.js'
      - 'scripts/checkRouteRateLimits.mjs'
      - '.github/workflows/route-rate-limit-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route-rate-limits:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Backend history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate checker syntax
        run: node --check scripts/checkRouteRateLimits.mjs
      - name: Check newly added routes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            node scripts/checkRouteRateLimits.mjs --base HEAD~1 --head HEAD
          else
            node scripts/checkRouteRateLimits.mjs --base "$BASE_SHA" --head "$HEAD_SHA"
          fi
